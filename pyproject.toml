[project]
name = "PerturbGen"
version = "0.1.0"
description = "Cell state and temporal prediction of scRNA-seq data"
authors = [
    {name = "kchl5",email = "k.ly@hotmail.ch"}
]
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
perturbgen = "perturbgen.__main__:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "perturbgen" }]

# Direct dependencies only. Transitive pins live in poetry.lock.
# Install: `poetry install` (preferred) or `pip install -r requirements.txt`.
[tool.poetry.dependencies]
python = ">=3.11,<4.0"

# Core scientific stack
numpy = "2.2.0"
pandas = "2.2.3"
scipy = "1.14.1"
anndata = "0.11"
scanpy = "1.11.2"
h5py = "3.12.1"
pyarrow = "18.1.0"
numba = "0.61.2"
llvmlite = "0.44.0"
scikit-learn = "1.5.2"
statsmodels = "0.14.4"
umap-learn = "0.5.7"
leidenalg = "0.10.2"
igraph = "0.11.8"

# Deep learning / training
torch = "2.5.1"
pytorch-lightning = "2.4.0"
lightning = "2.4.0"
torchmetrics = "1.4.1"
einops = "0.8.0"
deepspeed = "0.15.4"
accelerate = "1.2.0"
peft = "0.14.0"
scvi-tools = "1.3.1.post1"

# HuggingFace / tokenization
datasets = "3.0.0"
transformers = "4.47.0"
huggingface-hub = "0.26.5"
tokenizers = "0.21.0"
safetensors = "0.4.5"
evaluate = "0.4.3"
rouge-score = "^0.1.2"

# CLI, logging, plotting
click = "8.1.7"
tqdm = "4.67.1"
pyyaml = "6.0.2"
wandb = "0.17.9"
tensorboard = "2.18.0"
matplotlib = "3.9.3"
seaborn = "0.13.2"
pillow = "11.0.0"

# Notebooks 04–06 (gene programs / enrichment)
gseapy = "1.1.4"
adjusttext = "1.3.0"
ipykernel = "6.29.5"
ipython = "8.27.0"

# Optional training extras used by current scripts
ray = "2.40.0"
optuna = "4.1.0"
optuna-integration = "4.1.0"
mpi4py = "4.0.1"
sympy = "1.13.1"

[tool.poetry.group.dev.dependencies]
pytest = "7.4.4"
black = "22.1.0"
isort = "5.13.2"
flake8 = "4.0.1"
mypy = "1.13.0"
pre-commit = "3.8.0"

[tool.poetry.group.docs.dependencies]
sphinx = "^8.2.3"
sphinx-rtd-theme = "^3.0.2"
sphinx-autobuild = "^2024.10.3"
myst-nb = "^1.3.0"
