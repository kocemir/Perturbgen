    - copy_target
    - --tokenized
    - "/mnt/sod2-project/csb4/stuke1/perturbgen_reproduction/lps/tokenized_data/lps_90min_perturb"
    - --output-dir
    - "/mnt/sod2-project/csb4/stuke1/perturbgen/gene_query_jepa/count_decoder_runs/il1b_src_90m_jepa100_copytgt200_mask_qresync"
