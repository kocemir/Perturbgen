# MaskGIT / PerturbGen IL1B source knockout (notebook 06).
#
# 90m-retrained stack: lps_ko_90m_split90_mask + lps_ko_90m_split90_count.
# Folders: 1_6h_LPS, 2_10h_LPS  →  pred_tps [1, 2].
#
# Run:
#   cd /home/stuke1/perturbgen
#   python Perturbgen/perturbgen/Perturb/val.py \
#     --config Perturbgen/docs/examples/configs/ko/maskgit_il1b_src_90m.yaml

experiment:
  family: maskgit
  label: MaskGIT
  gene_ensembl: ENSG00000125538
  gene_symbol: IL1B
  source_time: 90m_LPS
  target_times: [6h_LPS, 10h_LPS]
  perturbation_sequence: src
  perturbation_mode: mask
  dump_glob: "*_minference_adata_gENSG00000125538_ssrc_tmask.h5ad"
  preferred_dump: "20260922-15:36_minference_adata_gENSG00000125538_ssrc_tmask.h5ad"

data:
  src_dataset_file: "/mnt/sod2-project/csb4/stuke1/perturbgen_reproduction/lps/tokenized_data/lps_90min_perturb/dataset_2000_hvg_src/90m_LPS.dataset"
  tgt_dataset_folder: "/mnt/sod2-project/csb4/stuke1/perturbgen_reproduction/lps/tokenized_data/lps_90min_perturb/dataset_2000_hvg_tgt"
  src_adata: "/mnt/sod2-project/csb4/stuke1/perturbgen_reproduction/lps/tokenized_data/lps_90min_perturb/h5ad_pairing_2000_hvg_src/90m_LPS.h5ad"
  tgt_adata_folder: "/mnt/sod2-project/csb4/stuke1/perturbgen_reproduction/lps/tokenized_data/lps_90min_perturb/h5ad_pairing_2000_hvg_tgt"

trainer:
  use_count_decoder: true
  n_samples: 3
  d_model: 768
  generate: false
  use_positional_encoding: false
  dropout: 0
  num_heads: 8
  num_layers: 6
  loss_mode: "zinb"
  d_ff: 32
  mask_scheduler: "pow"
  output_dir: "/mnt/sod2-project/csb4/stuke1/perturbgen_reproduction/lps/res/perturbation/il1b_src_90m_retrain"
  mapping_dict_path: "/mnt/sod2-project/csb4/stuke1/perturbgen_reproduction/lps/tokenized_data/lps_90min_perturb/token_id_to_genename_2000_hvg.pkl"
  tokenid_to_rowid_path: "/mnt/sod2-project/csb4/stuke1/perturbgen_reproduction/lps/tokenized_data/lps_90min_perturb/tokenid_to_rowid_2000_hvg.pkl"
  encoder: "scmaskgit"
  encoder_path: "Perturbgen/pretraining_cohort/20250709_1223_cellgen_train_masking_lr_5e-05_wd_1e-06_batch_64_ptime_pos_sin_m_pow_tp_1-2-3_s_42-epoch=00.ckpt"
  context_mode: false
  temperature: 1.5
  iterations: 19
  pos_encoding_mode: "time_pos_sin"
  exclude_src: false
  perturbation_mode: "mask"
  genes_to_perturb:
    - "ENSG00000125538"
  validation_mode: "inference"
  perturbation_sequence:
    - "src"
  var_list:
    - "cell_type_harmonized"
    - "cell_pairing_index"
    - "time_after_LPS"
  pred_tps:
    - 1
    - 2

datamodule:
  batch_size: 64
  num_workers: 0
  shuffle: false
  split: false
  var_list:
    - "cell_type_harmonized"
    - "time_after_LPS"
    - "cell_pairing_index"
  pred_tps:
    - 1
    - 2

model:
  precision: 16
  ckpt_masking_path: "/mnt/sod2-project/csb4/stuke1/perturbgen_reproduction/lps/res/lps_ko_90m_split90_count/checkpoints/20260912_1351_cellgen_train_count_lr_0.001_wd_0.001_batch_64_drop_0.1_zinb_tp_1-2_s_0_pos_time_pos_sin_m_pow-epoch=24.ckpt"

cli:
  cwd: /home/stuke1/perturbgen
  script: Perturbgen/perturbgen/Perturb/val.py
  args:
    - --config
    - Perturbgen/docs/examples/configs/ko/maskgit_il1b_src_90m.yaml
