# JEPA source_blind 90m + CountHead source_only IL1B KO (mask + qresync).
#
# JEPA: 90m→6h/10h source_blind qsb96 λ_absent=0.25, lr 5e-5, ~ep24
#       (...20261001_143041-last.ckpt)
# Count: source_only, 100 ep (...20261001_202210-last.ckpt)
#
# KO: replace IL1B in 90m source with <mask>; quiz resync so knocked-out
# gene gets src_position=-1. pred_tps 1,2 = 6h, 10h.

experiment:
  family: jepa
  label: JEPA source_blind src mask qresync
  gene_ensembl: ENSG00000125538
  gene_symbol: IL1B
  source_time: 90m_LPS
  target_times: [6h_LPS, 10h_LPS]
  perturbation_sequence: src
  perturbation_mode: mask
  count_input: source_only
  ko_resync_quiz: true
  dump_glob: "*_minference_adata_gENSG00000125538_ssrc_*qresync.h5ad"
  preferred_dump: "20261002-02:15_minference_adata_gENSG00000125538_ssrc_kmask_qresync.h5ad"
