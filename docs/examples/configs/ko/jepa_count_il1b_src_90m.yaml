# Archived 004618 + 101130 JEPA KO dump (il1b_src_90m_retrain).
# KO_comparison.ipynb no longer loads this file. Active settings are
# jepa_count_il1b_src_90m_{srconly,copytgt}_{pad,mask}.yaml.
#
# JEPA + CountHead IL1B source knockout (notebook 09).
#
# 90m-retrained stack (pred_tps [1, 2] = 6h / 10h folder prefixes):
#   JEPA  004618 epoch=08  (the ckpt the count head was trained on)
#   Count 101130 epoch=09
#
# Run (pick a free GPU):
#   cd /home/stuke1/perturbgen/Perturbgen
#   python docs/examples/train_gene_query_jepa.py \
#     --eval-count-ko true \
#     --jepa-ckpt  <model.jepa_ckpt> \
#     --count-ckpt <model.count_ckpt> \
#     --tokenized  <data.tokenized> \
#     --output-dir <trainer.output_dir> \
#     --ko-gene ENSG00000125538 \
#     --ko-replace mask \
#     --ko-pred-tps 1 2 \
#     --pred-tps 1,2 \
#     --data full --split false --batch-size 64 --gpu 0

experiment:
  family: jepa
  label: JEPA
  gene_ensembl: ENSG00000125538
  gene_symbol: IL1B
  source_time: 90m_LPS
  target_times: [6h_LPS, 10h_LPS]
  perturbation_sequence: src
  perturbation_mode: mask
  dump_glob: "*_minference_adata_gENSG00000125538_ssrc_*mask.h5ad"
  preferred_dump: "20260922-16:20_minference_adata_gENSG00000125538_ssrc_tmask.h5ad"
  gene_id_space: local_token

