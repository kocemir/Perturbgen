# Registry for KO_comparison.ipynb and panel_i_pathway_mirror.py.
# IL1B knockout at 90m LPS, predict 6h / 10h (pred_tps [1, 2]).
#
# Active comparison: MaskGIT mask, source_blind mask (20261001),
# and qsb64+tc48 JEPA with the 25ep pooled count head (20261013).
# Legacy pad/copytgt YAMLs were removed in the 2026-10-14 cleanup.
#
# Main KO tables use CD14 monocytes (IL1B-high). Lymphoid types below
# are only for the optional cytokine-panel / boxplot note.
#
# PATHS ARE MACHINE-SPECIFIC. `maps` and `output_dir` below, and every path
# inside each experiment's own YAML (`data`, `trainer.output_dir`,
# `model.*_ckpt`, `cli.args`), are absolute paths into this run's sod2
# storage -- unlike notebooks 02-08, these are not regenerated from a Python
# config cell (the registry spans 9 YAMLs with duplicated path fields, incl.
# inside `cli.args`; templating all of them was judged out of scope for this
# pass). On a new machine, update `maps`/`output_dir` here and the matching
# fields in each `configs/ko/*.yaml` this registry points to.

